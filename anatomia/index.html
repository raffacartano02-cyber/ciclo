<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Anatomia si è spostata</title>
  <style>
    :root { --bg: #f6f3ee; --card: #fff; --text: #1f1a17; --muted: #776d64; --accent: #b4401c; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141210; --card: #1e1b18; --text: #efe9e2; --muted: #a59a8f; --accent: #ec7a4f; color-scheme: dark; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 420px; background: var(--card); border-radius: 16px; padding: 24px; text-align: center; }
    h1 { font-size: 1.3rem; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 18px; }
    a { display: block; padding: 13px; border-radius: 10px; font-weight: 700; text-decoration: none; margin-top: 10px; }
    .main { background: var(--accent); color: #fff; }
    .alt { border: 1px solid var(--muted); color: var(--text); }
  </style>
</head>
<body>
  <main>
    <h1>Anatomia ha un nuovo indirizzo</h1>
    <p>L'app di anatomia ora è separata da Ciclo. Aprila dal nuovo link e installala da lì.</p>
    <a class="main" href="https://raffacartano02-cyber.github.io/anatomia/" target="_blank" rel="noopener">Apri Anatomia</a>
    <a class="alt" href="../">Torna a Ciclo</a>
  </main>
  <script>
    // Disattiva la vecchia copia offline di Anatomia rimasta sotto l'indirizzo di Ciclo
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => {
        if (r.scope.endsWith('/anatomia/')) r.unregister();
      })).catch(() => {});
    }
    if (window.caches) caches.keys().then(ks => ks.filter(k => k.startsWith('anatomia-')).forEach(k => caches.delete(k))).catch(() => {});
  </script>
</body>
</html>
